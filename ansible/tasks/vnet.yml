# One lab vnet (item: name, alias, subnet, gateway). A bridge that already
# exists is used as it is; otherwise it is created as a vnet in the lab's SDN
# zone, with the host as gateway. Proxmox files plain Linux bridges under the
# built-in zone "localnetwork".
- name: "{{ item.name }}: look up the vnet"
  ansible.builtin.command: pvesh get /cluster/sdn/vnets/{{ item.name }} --output-format json
  register: vnet_get
  failed_when: false
  changed_when: false

- name: "{{ item.name }}: look up the bridge"
  ansible.builtin.stat:
    path: /sys/class/net/{{ item.name }}/bridge
  register: bridge_dir

- name: "{{ item.name }}: check the zone"
  ansible.builtin.command: pvesh get /cluster/sdn/zones/{{ lab.sdn_zone }}
  register: zone_get
  failed_when: false
  changed_when: false

- name: "{{ item.name }}: decide the zone"
  ansible.builtin.set_fact:
    vnet_zone: >-
      {{ (vnet_get.stdout | from_json).zone if vnet_get.rc == 0
         else 'localnetwork' if bridge_dir.stat.exists
         else lab.sdn_zone }}
    vnet_new: "{{ vnet_get.rc != 0 and not bridge_dir.stat.exists }}"

- name: "{{ item.name }}: create zone {{ lab.sdn_zone }}"
  ansible.builtin.command: pvesh create /cluster/sdn/zones --zone {{ lab.sdn_zone }} --type simple --ipam pve
  when: vnet_new and zone_get.rc != 0
  changed_when: true

- name: "{{ item.name }}: create vnet"
  ansible.builtin.command: pvesh create /cluster/sdn/vnets --vnet {{ item.name }} --zone {{ vnet_zone }} --alias '{{ item.alias }}'
  when: vnet_new
  changed_when: true

- name: "{{ item.name }}: look up the subnet"
  ansible.builtin.command: pvesh get /cluster/sdn/vnets/{{ item.name }}/subnets/{{ vnet_zone }}-{{ item.subnet | replace('/', '-') }}
  register: subnet_get
  failed_when: false
  changed_when: false
  when: vnet_zone == lab.sdn_zone

- name: "{{ item.name }}: create subnet {{ item.subnet }}"
  ansible.builtin.command: >-
    pvesh create /cluster/sdn/vnets/{{ item.name }}/subnets
    --type subnet --subnet {{ item.subnet }} --gateway {{ item.gateway }}
  register: subnet_create
  when: vnet_zone == lab.sdn_zone and subnet_get.rc != 0
  changed_when: true

# Configured but never applied, e.g. after an interrupted run
- name: "{{ item.name }}: check the bridge is up"
  ansible.builtin.stat:
    path: /sys/class/net/{{ item.name }}
  register: bridge_up

- name: "{{ item.name }}: record changes"
  ansible.builtin.set_fact:
    sdn_changed: "{{ sdn_changed or vnet_new or subnet_create is changed or not bridge_up.stat.exists }}"
    lab_zones: "{{ lab_zones | union([vnet_zone]) }}"
