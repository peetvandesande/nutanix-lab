# Lab network on the Proxmox host, built by scripts/bootstrap-proxmox.sh and
# removed by scripts/teardown-proxmox.sh. See NETWORK.md for the design.
#
# The two vnets are named by bridge and external_bridge in terraform.tfvars.

SDN_ZONE=ntnx

# AHV hosts, CVMs and Prism Central (first NIC of each node)
UNDERLAY_SUBNET=192.168.33.0/24
UNDERLAY_GATEWAY=192.168.33.1

# Uplink of the VPC (second NIC of each node)
EXTERNAL_SUBNET=192.168.37.0/24
EXTERNAL_GATEWAY=192.168.37.1

# Everything the lab uses. Traffic from this range is source-NATed when it
# leaves the Proxmox host
LAB_RANGE=192.168.32.0/21

# Overlay subnets inside the VPC, and the VPC's address on the external
# subnet. Leave VPC_ROUTER_IP empty until the VPC exists, then set it and
# re-run the bootstrap to add the routes
OVERLAY_SUBNETS="192.168.34.0/24 192.168.35.0/24 192.168.36.0/24"
VPC_ROUTER_IP=
